name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build cross-platform projects
        # The WinForms app (net8.0-windows) only builds on Windows, so the Linux
        # job builds the cross-platform projects explicitly. The full solution is
        # validated by the build-windows job below.
        run: dotnet build src/HmSth.Poc/HmSth.Poc.csproj tests/HmSth.Poc.Tests/HmSth.Poc.Tests.csproj
      - name: Run tests
        run: dotnet test --no-build tests/HmSth.Poc.Tests/HmSth.Poc.Tests.csproj
      - name: Check line endings
        run: |
          if grep -rlP '\r$' --include="*.md" .; then
            echo "::error::CRLF line endings found in markdown files"
            exit 1
          fi
      - name: Check no BOM
        run: |
          if grep -rlU $'\xEF\xBB\xBF' --include="*.md" .; then
            echo "::error::UTF-8 BOM found in markdown files"
            exit 1
          fi

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Build solution (includes WinForms app)
        run: dotnet build